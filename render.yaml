# Blueprint para desplegar en Render (https://render.com).
#
# ─── ASÍ, TAL CUAL: plan GRATIS (ideal para pruebas) ────────────────
# El plan free NO permite disco persistente: el sistema de archivos es
# efímero, así que la base de datos SQLite se BORRA SOLA cada vez que el
# servicio se reinicia o se vuelve a desplegar. Para las pruebas eso es
# cómodo: "limpiar la base de datos" = hacer un nuevo deploy.
#
# ─── PARA EL ENVÍO REAL (que NO se pierdan las respuestas) ──────────
# 1. Cambia `plan: free` por `plan: starter`.
# 2. Descomenta el bloque `disk:` de abajo.
# 3. Cambia DATABASE_FILE a /data/app.db.
# Así la base de datos vive en un disco que sobrevive a los reinicios.

services:
  - type: web
    name: rosa-amarilla            # tu URL sera https://rosa-amarilla.onrender.com
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /no-disponible
    # disk:                        # (solo en plan starter o superior)
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_FILE
        value: ./data/app.db       # en plan de pago con disco: /data/app.db
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: REQUIRE_ACTIVATION_BY_DEFAULT
        value: "true"
      - key: BASE_URL
        sync: false                # define tu URL de Render en el panel
      - key: SESSION_SECRET
        generateValue: true        # Render genera un secreto seguro
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
